---
name: Pawmmit
on:
  push:
    branches:
    - master
    - main
    tags:
    - 'v*'
  pull_request:
  workflow_dispatch:

env:
  IS_RELEASE: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startswith(github.ref_name, 'v') }}

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Run clang-format style check
      uses: jidicula/clang-format-action@v4.18.0
      with:
        clang-format-version: '19'
        exclude-regex: 'subprojects'

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
    - name: Update
      run: |
        pacman --noconfirm -Suy
        pacman --noconfirm -S flatpak flatpak-builder xorg-server-xvfb
        flatpak install --assumeyes org.freedesktop.Sdk.Extension.golang//23.08

    - name: Determine flatpak release branch
      id: flatpak_release_branch
      run: |
        if [ "${{ env.IS_RELEASE }}" = "true" ]; then
          echo "value=stable" >> "$GITHUB_OUTPUT"
        else
          echo "value=development" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Point manifest at this checkout
      if: github.ref_type != 'tag'
      run: >
        sed -i 's@\(tag\|branch\|commit\): .*@commit: "${{ (github.event.pull_request && github.event.pull_request.head.sha) || github.sha }}"@' com.github.Pawmmit.Pawmmit.yml
    - name: Use correct git tag
      if: github.ref_type == 'tag'
      run: >
        sed -i 's@\(tag\|branch\|commit\): .*$@tag: "${{ github.ref_name }}"@' com.github.Pawmmit.Pawmmit.yml
    - name: Replace source url
      run: >
        sed -i "s@url: .*Pawmmit.git@url: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY@" com.github.Pawmmit.Pawmmit.yml
    - name: Add dev build marker
      if: github.ref_type != 'tag'
      run: |
        sed -i 's@\("-Dflatpak=true"\)@\1, "-Ddev_build=${{ github.ref_name }}"@' com.github.Pawmmit.Pawmmit.yml
        sed -i 's@desktop-file-name-suffix: ""@desktop-file-name-suffix: " (Development)"@' com.github.Pawmmit.Pawmmit.yml
        sed -i 's@"-Denable_update_over_gui=false"@"-Denable_update_over_gui=true"@' com.github.Pawmmit.Pawmmit.yml

    - name: Show Flatpak manifest
      run: cat com.github.Pawmmit.Pawmmit.yml

    - name: Build package
      uses: bilelmoussaoui/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: Pawmmit.flatpak
        manifest-path: com.github.Pawmmit.Pawmmit.yml
        cache: false
        upload-artifact: true
        verbose: true
        branch: ${{ steps.flatpak_release_branch.outputs.value }}

    - name: Publish build artifacts
      uses: actions/upload-artifact@v6
      with:
        path: Pawmmit.flatpak
        name: PawmmitFlatpak

  build:
    runs-on: ${{ matrix.env.os }}
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        qt:
          - version: 6.7.3
        env:
          - name: linux
            os: ubuntu-26.04
            qt_platform: linux
            qt_arch: linux_gcc_64
            ld_library_arch: linux-x86-64
            pack: 0
          - name: macos
            os: macos-15
            qt_platform: mac
            pack: 1
          - name: win64
            os: windows-latest
            qt_platform: windows
            qt_arch: win64_msvc2019_64
            msvc_arch: x64
            pack: 1

    steps:
      - name: Set git identity (tests create commits)
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"

      - name: Configure development build
        if: github.ref_type != 'tag'
        shell: bash
        run: echo "DEV_BUILD=${{ github.ref_name }}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ matrix.env.name == 'linux' && 0 || 1 }}

      - name: Install build tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "meson>=1.4" ninja
      - run: pip install gcovr diff-cover
        if: matrix.env.name == 'linux'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.0
        timeout-minutes: 10
        with:
          version: ${{ matrix.qt.version }}
          target: desktop
          host: ${{ matrix.env.qt_platform }}
          arch: ${{ matrix.env.qt_arch }}
          install-deps: true
          modules: qt5compat

      - name: Setup MSVC environment
        if: matrix.env.name == 'win64'
        uses: seanmiddleditch/gha-setup-vsdevenv@v5
        with:
          arch: ${{ matrix.env.msvc_arch }}

      # libgit2 needs a real system package everywhere (see meson.build for
      # why); everything else has a wrap fallback and builds from source if
      # missing, so CI doesn't install it. appstream provides appstreamcli,
      # required on Linux for AppStream metadata generation.
      - name: Install dependencies (Linux)
        if: matrix.env.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config xvfb libgit2-dev appstream

      - name: Install dependencies (macOS)
        if: matrix.env.name == 'macos'
        run: brew install pkg-config libgit2

      # vcpkg's default local binary cache (see vcpkg docs on binary caching)
      # otherwise starts empty on every run, forcing OpenSSL/libssh2/libgit2
      # to rebuild from source each time.
      - name: Cache vcpkg archives
        if: matrix.env.name == 'win64'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-archives-win64-${{ github.sha }}
          restore-keys: |
            vcpkg-archives-win64-

      - name: Install dependencies (Windows)
        if: matrix.env.name == 'win64'
        shell: pwsh
        run: |
          vcpkg install libgit2[ssh] --triplet x64-windows
          choco install nsis -y
          # choco's own PATH update (via the registry) doesn't reach later
          # steps in this job, so add makensis's dir explicitly.
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
          echo "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" >> $env:GITHUB_ENV

      # Add workaround due to 'shell: bash'
      # See https://github.com/ilammy/msvc-dev-cmd#name-conflicts-with-shell-bash
      - name: Remove link.exe
        if: matrix.env.name == 'win64'
        shell: pwsh
        run: Remove-Item "C:\Program Files\Git\usr\bin\link.EXE" -Force -ErrorAction SilentlyContinue

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # sccache's own disk cache (separate from vcpkg's above) is what makes
      # unchanged objects across runs free instead of just fast.
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sccache
            ~/Library/Caches/Mozilla.sccache
            ~/AppData/Local/Mozilla/sccache
          key: sccache-${{ matrix.env.name }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ matrix.env.name }}-

      # Meson auto-wraps gcc/clang with a cache found on PATH, but MSVC needs
      # CC/CXX set explicitly before the first `meson setup`.
      - name: Point compilers at sccache
        shell: bash
        run: |
          echo "SCCACHE_CACHE_SIZE=2G" >> "$GITHUB_ENV"
          case "${{ matrix.env.name }}" in
            win64) echo "CC=sccache cl"; echo "CXX=sccache cl" ;;
            macos) echo "CC=sccache cc"; echo "CXX=sccache c++"; echo "OBJCXX=sccache clang++" ;;
            linux) echo "CC=sccache cc"; echo "CXX=sccache c++" ;;
          esac >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        # Git Bash on Windows rewrites args that look like POSIX paths (e.g.
        # "/usr") into a Windows path under its own install dir; disable that
        # so --prefix reaches meson literally.
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          meson setup build \
            --buildtype=release \
            --prefix=/usr \
            -Dci_tests=true \
            -Dupdate_translations=true \
            ${DEV_BUILD:+-Ddev_build="$DEV_BUILD"} \
            $( [ "${{ matrix.env.name }}" = "linux" ] && echo "-Dbundled=true -Db_coverage=true" )

      - name: Build
        run: meson compile -C build

      - name: Test (Linux)
        if: matrix.env.name == 'linux'
        run: xvfb-run -a meson test -C build --print-errorlogs

      - name: Test (Windows)
        if: matrix.env.name == 'win64'
        run: meson test -C build --print-errorlogs

      - name: Test (macOS)
        if: matrix.env.name == 'macos'
        run: meson test -C build --print-errorlogs

      - name: Generate coverage reports
        if: matrix.env.name == 'linux'
        run: |
          mkdir coverage
          gcovr -r . build -e subprojects -e test \
            --xml coverage/coverage.xml \
            --html-details coverage/index.html \
            --txt-summary | tee coverage/summary.txt

      - name: Write coverage summary
        if: matrix.env.name == 'linux'
        run: |
          {
            echo "### Test coverage"
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } > report.md
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            diff-cover coverage/coverage.xml \
              --compare-branch="origin/${{ github.base_ref }}" \
              --format markdown:patch.md,json:patch.json
            {
              echo
              echo "**Coverage of lines changed in this PR: $(jq .total_percent_covered patch.json)%**"
              echo
              echo "<details><summary>Uncovered changed lines</summary>"
              echo
              cat patch.md
              echo
              echo "</details>"
            } >> report.md
          fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request
        if: matrix.env.name == 'linux' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: report.md

      - name: Upload HTML coverage report
        if: matrix.env.name == 'linux'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/

      - name: Package (macOS / Windows)
        if: matrix.env.pack == 1
        shell: bash
        run: meson install -C build --destdir "$PWD/stage"

      - name: Publish version file
        if: matrix.env.name == 'linux'
        uses: actions/upload-artifact@v6
        with:
          path: build/Version.txt
          name: Pawmmit-VERSION

      - name: Publish package artifacts
        if: matrix.env.pack == 1
        uses: actions/upload-artifact@v6
        with:
          path: build/pack/Pawmmit-*
          name: Pawmmit ${{ matrix.env.name }}

      - name: Build AppImage
        if: matrix.env.name == 'linux'
        run: |
          sudo apt -y install appstream libfuse2 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-cursor0 libxkbcommon0 libx11-xcb1 libxcb-shm0 libxcb-sync1 \
            libxcb-util1 libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1

          DESTDIR="$PWD/AppDir" meson install -C build
          rm -rf ./AppDir/usr/include/
          strip ./AppDir/usr/bin/pawmmit ./AppDir/usr/bin/pawmmit-indexer ./AppDir/usr/bin/pawmmit-relauncher || true

          # Subproject libs (e.g. lua) only exist inside AppDir, not on the
          # system lib path, so linuxdeploy can't resolve them without this.
          # Prepend rather than overwrite: install-qt-action already put Qt's
          # own lib dir in LD_LIBRARY_PATH, which linuxdeploy also needs.
          export LD_LIBRARY_PATH="$(find "$PWD/AppDir" -name '*.so*' -printf '%h\n' | sort -u | paste -sd: -):${LD_LIBRARY_PATH:-}"

          wget -c https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -c https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          wget -c https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage
          export PATH="$PWD:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export VERSION="$(cat build/Version.txt)"
          # linuxdeploy-plugin-qt only bundles libqxcb.so by default.
          export EXTRA_PLATFORM_PLUGINS="libqwayland-generic.so;libqwayland-egl.so"
          # appdata.xml currently fails strict AppStream validation (see PR/commit
          # notes); skip it here rather than block every AppImage build on that.
          export LDAI_NO_APPSTREAM=1

          # Custom AppRun: exec's via the bundled glibc loader below instead of
          # the kernel's own interpreter lookup, so the host's glibc version
          # doesn't matter; still sources apprun-hooks like the default one.
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'for hook in "$HERE"/apprun-hooks/*.sh; do' \
            '  [ -f "$hook" ] && . "$hook"' \
            'done' \
            'exec "$HERE/usr/lib/ld-linux-x86-64.so.2" "$HERE/usr/bin/pawmmit" "$@"' \
            > ./AppRun.custom
          chmod +x ./AppRun.custom

          linuxdeploy-x86_64.AppImage \
            --appdir ./AppDir \
            --executable ./AppDir/usr/bin/pawmmit \
            --desktop-file ./AppDir/usr/share/applications/com.github.Pawmmit.Pawmmit.desktop \
            --icon-file ./AppDir/usr/share/icons/hicolor/256x256/apps/pawmmit.png \
            --custom-apprun ./AppRun.custom \
            --plugin qt

          # EXTRA_PLATFORM_PLUGINS doesn't pull in wayland's graphics-integration
          # plugins; copy them in and rerun the qt plugin to deploy their deps.
          qt_plugins_dir="$(qmake -query QT_INSTALL_PLUGINS)"
          if [ -d "$qt_plugins_dir/wayland-graphics-integration-client" ]; then
            mkdir -p ./AppDir/usr/plugins/wayland-graphics-integration-client
            cp "$qt_plugins_dir"/wayland-graphics-integration-client/*.so \
              ./AppDir/usr/plugins/wayland-graphics-integration-client/
            linuxdeploy-plugin-qt-x86_64.AppImage --appdir ./AppDir
          fi

          # Bundle glibc's loader and libraries so the AppImage isn't tied to
          # this build machine's (very new) glibc version. The same goes for
          # libstdc++ and libgcc_s, which linuxdeploy leaves to the host.
          lib_dir="$(dirname "$(find ./AppDir -name 'libQt6Core.so*' | head -n1)")"
          interp="$(readelf -p .interp ./AppDir/usr/bin/pawmmit | awk '/\[/{print $NF}')"
          cp "$interp" "$lib_dir/ld-linux-x86-64.so.2"

          targets="./AppDir/usr/bin/pawmmit ./AppDir/usr/bin/pawmmit-indexer ./AppDir/usr/bin/pawmmit-relauncher $(find ./AppDir -name '*.so*')"
          for f in $targets; do
            [ -f "$f" ] || continue
            ldd "$f" 2>/dev/null
          done | awk '/lib(c|m|dl|pthread|rt|resolv|nss_[a-z]+|stdc\+\+|gcc_s)(-[0-9.]+)?\.so/ {print $1, $3}' | sort -u |
            while read -r name path; do
              [ -f "$path" ] && [ ! -e "$lib_dir/$name" ] && cp "$path" "$lib_dir/"
            done

          # Package via the appimage plugin directly rather than through
          # linuxdeploy's own --output appimage: that path re-runs its
          # dependency/rpath/strip pass over the whole AppDir first, which
          # corrupts the hand-bundled ld.so above.
          linuxdeploy-plugin-appimage-x86_64.AppImage --appdir ./AppDir

      - name: Publish AppImage
        if: matrix.env.name == 'linux'
        uses: actions/upload-artifact@v6
        with:
          path: Pawmmit*.AppImage
          name: PawmmitAppImage

  # Runs the packaged app on a fresh runner that never had Qt or the build
  # dependencies installed, so anything the package failed to bundle is missing.
  smoke-test:
    name: Smoke test (${{ matrix.env.name }})
    needs: build
    runs-on: ${{ matrix.env.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        env:
          - name: macos
            os: macos-15
          - name: win64
            os: windows-latest

    steps:
      - name: Download package
        uses: actions/download-artifact@v6
        with:
          name: Pawmmit ${{ matrix.env.name }}
          path: package

      - name: Check the runner is clean (macOS)
        if: matrix.env.name == 'macos'
        run: |
          clean=1
          for formula in libgit2 qt qt@6; do
            if brew list --versions "$formula" >/dev/null 2>&1; then
              echo "::error::$formula is installed"
              clean=0
            fi
          done
          for tool in qmake6 macdeployqt6; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool is on PATH"
              clean=0
            fi
          done
          if env | grep -E '^(QT|Qt)[A-Za-z0-9_]*=' >/dev/null; then
            echo "::error::Qt environment variables are set"
            clean=0
          fi
          [ "$clean" = 1 ]

      - name: Check the runner is clean (Windows)
        if: matrix.env.name == 'win64'
        shell: pwsh
        run: |
          $problems = @()
          foreach ($name in 'qmake6.exe', 'windeployqt6.exe', 'Qt6Core.dll', 'git2.dll') {
            where.exe /Q $name 2>$null
            if ($LASTEXITCODE -eq 0) { $problems += "$name is on PATH" }
          }
          if (Test-Path "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\git2.dll") {
            $problems += "vcpkg has git2.dll installed"
          }
          foreach ($name in 'Qt6_DIR', 'QT_ROOT_DIR', 'QT_PLUGIN_PATH') {
            if (Test-Path "Env:$name") { $problems += "$name is set" }
          }
          if ($problems) {
            $problems | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          # where.exe exits 1 when it finds nothing, which pwsh steps would
          # otherwise report as the step's own exit code.
          exit 0

      - name: Install (macOS)
        if: matrix.env.name == 'macos'
        run: |
          dmg="$(ls package/Pawmmit-*.dmg | head -n1)"
          echo "Installing $dmg"
          mkdir -p "$RUNNER_TEMP/dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
          app="$(find "$RUNNER_TEMP/dmg" -maxdepth 2 -name '*.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "::error::The disk image contains no .app; its top level is:"
            ls -la "$RUNNER_TEMP/dmg"
            exit 1
          fi
          cp -R "$app" "$RUNNER_TEMP/Pawmmit.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          echo "APP=$RUNNER_TEMP/Pawmmit.app" >> "$GITHUB_ENV"

      - name: Install (Windows)
        if: matrix.env.name == 'win64'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem package\Pawmmit-win64-*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'Pawmmit'
          Write-Host "Installing $installer"
          # NSIS wants /D last and unquoted.
          $p = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with code $($p.ExitCode)" }
          "APP_DIR=$dir" >> $env:GITHUB_ENV

      - name: Run (macOS)
        if: matrix.env.name == 'macos'
        run: |
          # Uses the real Cocoa platform plugin rather than offscreen, so a
          # bundle missing it fails here.
          test -f "$APP/Contents/PlugIns/platforms/libqcocoa.dylib"
          output="$("$APP/Contents/MacOS/pawmmit" --version)"
          echo "$output"
          case "$output" in
            Pawmmit*) ;;
            *) echo "::error::Unexpected --version output"; exit 1 ;;
          esac

      - name: Run (Windows)
        if: matrix.env.name == 'win64'
        shell: pwsh
        run: |
          $exe = Join-Path $env:APP_DIR 'bin\pawmmit.exe'
          if (-not (Test-Path (Join-Path $env:APP_DIR 'bin\platforms\qwindows.dll'))) {
            throw "qwindows.dll is missing from the install"
          }
          # Only the system directories, so the app has to bring its own DLLs.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          # A GUI app has no console to print --version to, so start it, give
          # it time to fail, and stop it if it's still running.
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            throw ("pawmmit.exe exited early with code 0x{0:X} (0xC0000135 means a DLL is missing)" -f $p.ExitCode)
          }
          Stop-Process -Id $p.Id -Force

      - name: Show bundle details (macOS)
        if: failure() && matrix.env.name == 'macos'
        run: |
          app="${APP:-}"
          [ -n "$app" ] || exit 0
          ls "$app/Contents" "$app/Contents/Frameworks" "$app/Contents/PlugIns" || true
          otool -L "$app/Contents/MacOS/pawmmit" || true

      - name: Show install details (Windows)
        if: failure() && matrix.env.name == 'win64'
        shell: pwsh
        run: |
          if ($env:APP_DIR) { Get-ChildItem -Recurse -Depth 1 $env:APP_DIR | Select-Object -First 200 FullName }

  # Runs the AppImage in bare containers of older distributions, which have no
  # Qt and a much older glibc than the build machine, with only the basic
  # desktop libraries that AppImages are expected to find on the host.
  smoke-test-appimage:
    name: Smoke test (AppImage on ${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - debian:12

    steps:
      - name: Download AppImage
        uses: actions/download-artifact@v6
        with:
          name: PawmmitAppImage
          path: package

      - name: Run
        run: |
          docker run --rm -i \
            -v "$PWD/package:/package:ro" \
            ${{ matrix.image }} bash -eu <<'EOF'
          export DEBIAN_FRONTEND=noninteractive
          export LANG=C.UTF-8
          apt-get update -qq
          apt-get install -y -qq xvfb fontconfig libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 >/dev/null

          # Nothing of the app's own dependencies may be on the system.
          if ldconfig -p | grep -E 'libQt6Core|libgit2'; then
            echo "::error::Qt or libgit2 is installed in the container"
            exit 1
          fi
          ldd --version | head -n1

          diagnose() {
            echo "--- libraries the app can't find"
            cd /tmp
            ./pawmmit.AppImage --appimage-extract >/dev/null 2>&1 || true
            ldd squashfs-root/usr/bin/pawmmit 2>&1 | grep -i 'not found' || true
          }
          trap diagnose ERR

          # AppImages are not executable after a download, and there is no FUSE
          # in the container, so unpack it on the fly.
          cp /package/Pawmmit*.AppImage /tmp/pawmmit.AppImage
          chmod +x /tmp/pawmmit.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1

          # Qt may print notices around the version, so look at every line.
          expect_version() {
            if ! printf '%s\n' "$1" | grep -qE '^Pawmmit [0-9]'; then
              echo "::error::Unexpected --version output: $1"
              exit 1
            fi
          }

          # The AppImage bundles the xcb and Wayland plugins but not offscreen,
          # so run on the real xcb platform under a virtual X server.
          out="$(xvfb-run -a /tmp/pawmmit.AppImage --version)"
          echo "$out"
          expect_version "$out"
          EOF

  publish:
    needs: [flatpak, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'push' && github.ref_type == 'tag' && startswith(github.ref_name, 'v')) }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Retrieve version
        id: version
        run: echo "VERSION=$(cat artifacts/Pawmmit-VERSION/Version.txt)" >> "$GITHUB_OUTPUT"

      - name: Update GitHub release (development)
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            artifacts/PawmmitFlatpak/*.flatpak
            artifacts/PawmmitAppImage/Pawmmit*.AppImage
            "artifacts/Pawmmit win64"/Pawmmit-*.exe
            "artifacts/Pawmmit macos"/Pawmmit-*.dmg
          )
          if [ ${#files[@]} -eq 0 ]; then echo "No assets."; exit 1; fi
          if ! gh release view development --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create development --repo "${{ github.repository }}" --prerelease \
              --title "Latest Build (Development)" --target "${{ github.sha }}" "${files[@]}"
          else
            gh release upload development "${files[@]}" --repo "${{ github.repository }}" --clobber
          fi

      - name: Update GitHub release (version tag)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          TAG="${{ github.ref_name }}"
          files=(
            artifacts/PawmmitFlatpak/*.flatpak
            artifacts/PawmmitAppImage/Pawmmit*.AppImage
            "artifacts/Pawmmit win64"/Pawmmit-*.exe
            "artifacts/Pawmmit macos"/Pawmmit-*.dmg
          )
          if [ ${#files[@]} -eq 0 ]; then echo "No assets."; exit 1; fi
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "Pawmmit ${{ steps.version.outputs.VERSION }}" --target "${{ github.sha }}" "${files[@]}"
          else
            gh release upload "$TAG" "${files[@]}" --repo "${{ github.repository }}" --clobber
          fi
